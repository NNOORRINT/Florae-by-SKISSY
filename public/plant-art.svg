  <path d="M140 302 Q150 310 160 302" fill="none" stroke="#16142e" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="122" cy="300" rx="7" ry="4" fill="#ffffff" fill-opacity=".45"/>
  <ellipse cx="178" cy="300" rx="7" ry="4" fill="#ffffff" fill-opacity=".45"/>
