  <path d="M124 40 C128 50 132 56 138 62" stroke="#ffffff" stroke-opacity=".6" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- sparkles -->
  <path d="M40 200 l5 -12 l5 12 l12 5 l-12 5 l-5 12 l-5 -12 l-12 -5 Z" fill="#ffd23f" stroke="#16142e" stroke-width="3" stroke-linejoin="round"/>
  <path d="M258 196 l3 -8 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 Z" fill="#3de0ff" stroke="#16142e" stroke-width="3" stroke-linejoin="round"/>
