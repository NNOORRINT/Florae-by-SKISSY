    <rect x="72" y="232" width="156" height="34" rx="12" fill="#ff8fc1"/>
    <!-- pot -->
    <path d="M86 264 H214 L200 318 Q197 330 184 330 H116 Q103 330 100 318 Z" fill="#ff5fa2"/>
